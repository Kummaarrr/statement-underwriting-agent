[project]
name = "stmt-uw"
version = "0.1.0"
description = "Bank-statement underwriting agent: reconciled transactions, key figures, tamper flags - measured against exact ground truth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2"]
app = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "types-pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["stmt_uw"]
mypy_path = "src"
ignore_missing_imports = true
